version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: moneyease_postgres
    restart: always
    environment:
      POSTGRES_USER: moneyease
      POSTGRES_PASSWORD: moneyease_secret
      POSTGRES_DB: moneyease_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyease -d moneyease_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moneyease_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://moneyease:moneyease_secret@db:5432/moneyease_db
      SECRET_KEY: moneyease-super-secure-jwt-secret-key-production-ready-2026
      FERNET_KEY: uE2N_l4-O9xP7G2j5K8y1W4r6T8u0Z2x4C6v8B0n2M4=
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
